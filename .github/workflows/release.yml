name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build API
        run: cd api && CGO_ENABLED=0 go build -ldflags "-X main.version=${{ github.ref_name }}" -o ../dist/proxmaid ./cmd/proxmaid/

      - name: Build UI
        run: cd ui && npm ci && npm run build && cp -r out ../dist/ui

      - name: Build .deb package
        run: make package VERSION=${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/proxmaid_*_amd64.deb
            dist/proxmaid
          generate_release_notes: true
